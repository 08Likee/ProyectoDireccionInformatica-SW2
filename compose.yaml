name: direccion-informatica
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-direccion_informatica}
      POSTGRES_USER: ${POSTGRES_USER:-direccion_informatica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-direccion_informatica}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-direccion_informatica}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    command: ["mvn", "-B", "spring-boot:run"]
  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${APP_PORT:-5173}:5173"
    depends_on:
      - backend
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
volumes:
  postgres_data:
  maven_cache:
  node_modules:
