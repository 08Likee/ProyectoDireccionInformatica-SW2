name: direccion-informatica-nest
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-direccion_informatica}
      POSTGRES_USER: ${POSTGRES_USER:-direccion_informatica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_nest_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: '3000'
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-direccion_informatica}
      POSTGRES_USER: ${POSTGRES_USER:-direccion_informatica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run start:dev"]
  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "127.0.0.1:${APP_PORT:-5174}:5173"
    depends_on:
      - backend
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
volumes:
  postgres_nest_data:
  backend_node_modules:
  frontend_node_modules:
